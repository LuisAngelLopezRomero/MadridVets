<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="Guía veterinaria personal con protocolos de medicación y calculadora de dosis para uso profesional.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vet Guide">
  <title>Vet Guide</title>
  
  
  <style>
:root{
  --bg:#0f1115;--card:#171a21;--card2:#1d2129;--text:#f7f8fa;--muted:#aeb4c0;
  --line:#2b303a;--accent:#ef4444;--ok:#65c58f;--warning:#ffbf69;--danger:#ff8178;
  --shadow:0 12px 34px rgba(0,0,0,.22)
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
button{color:inherit}
.app{max-width:1160px;margin:0 auto;padding:18px 14px 56px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(255,255,255,.32);outline-offset:3px}

/* Splash */
.splash{min-height:730px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 20px 80px}
.splash-logo{width:108px;height:108px;border-radius:30px;background:linear-gradient(145deg,#d32f2f,#741f3a);display:grid;place-items:center;font-size:54px;box-shadow:0 20px 70px rgba(198,40,40,.24);margin-bottom:26px}
.splash-eyebrow{color:#cfd3dc;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;margin-bottom:12px}
.splash-title{font-size:clamp(54px,12vw,86px);line-height:.95;letter-spacing:-3px;margin:0}
.splash-subtitle{max-width:590px;margin:22px auto 34px;color:var(--muted);font-size:clamp(18px,4vw,25px);line-height:1.45}
.splash-actions{display:flex;gap:11px;flex-wrap:wrap;justify-content:center}
.primary-btn,.secondary-btn{min-height:54px;border-radius:18px;padding:0 22px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:11px;cursor:pointer}
.primary-btn{border:0;background:#f3f4f6;color:#111318}
.secondary-btn{border:1px solid #383e49;background:#171a21;color:#f4f6f8}
.splash-foot{max-width:500px;margin:18px 0 0;color:#747b88;font-size:12px;line-height:1.5}

/* Dashboard */
.hero{padding:22px 12px 16px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#e53935,#7b1e3a);display:grid;place-items:center;font-size:30px;box-shadow:var(--shadow)}
.logo-button{border:0;padding:0;cursor:pointer}
h1{font-size:34px;margin:0;letter-spacing:-.5px}
.tagline{margin:6px 0 0;color:var(--muted);font-size:15px;line-height:1.4}
.dashboard-actions{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin:17px 4px}
.action-card{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:17px;text-align:left;cursor:pointer;display:flex;gap:14px;align-items:center;min-width:0}
.action-card strong{display:block;font-size:16px}
.action-card span{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:4px}
.action-icon{width:46px;height:46px;border-radius:14px;background:#242933;display:grid;place-items:center;font-size:23px;flex:0 0 auto}
.patient-pill{border:1px solid #344038;background:#16221b}
.quick{display:flex;gap:10px;margin:12px 4px 17px;flex-wrap:wrap}
.search{flex:1;min-width:230px;background:#171a21;border:1px solid var(--line);color:#fff;border-radius:16px;padding:14px 16px;outline:none}
.badge{border:1px solid var(--line);background:#171a21;color:#d9dde5;padding:12px 14px;border-radius:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 4px}
.card{position:relative;overflow:hidden;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:20px;min-height:150px;cursor:pointer;box-shadow:var(--shadow);transition:.18s transform}
.card:active,.action-card:active,.primary-btn:active,.secondary-btn:active{transform:scale(.985)}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--c)}
.card .icon{font-size:29px}.card h2{margin:12px 0 8px;font-size:21px}.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.45;padding-right:20px}
.count{position:absolute;right:16px;top:16px;font-size:12px;color:#dfe2e8;border:1px solid #343a46;background:#111318;padding:5px 8px;border-radius:999px}
.chev{position:absolute;right:17px;bottom:15px;color:#7d8490;font-size:22px}
.results{display:none;margin:0 4px 16px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#171a21}
.result{display:block;width:100%;text-align:left;padding:13px 15px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer}
.result:last-child{border-bottom:0}.result strong{display:block}.result span{color:var(--muted);font-size:12px}.empty{padding:18px;color:var(--muted)}

/* Shared page top */
.topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;background:rgba(15,17,21,.94);backdrop-filter:blur(12px);padding:10px 0 14px}
.back{border:1px solid var(--line);background:#171a21;color:#fff;border-radius:14px;padding:10px 13px;cursor:pointer;min-height:44px}
.titlewrap{flex:1;min-width:0}.ptitle{margin:0;font-size:23px}.psub{margin:3px 0 0;color:var(--muted);font-size:13px}
.ribbon{height:5px;border-radius:999px;margin:2px 0 14px;background:var(--c)}
.notice{margin:16px 0 0;padding:14px 16px;background:#171a21;border:1px solid var(--line);border-radius:16px;color:#c7ccd5;font-size:12px;line-height:1.5}

/* Protocol table */
.tablewrap{border:1px solid var(--line);border-radius:20px;overflow:auto;background:#14171c;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:1040px}
thead th{position:sticky;top:0;background:#20242c;color:#fff;text-align:left;font-size:12px;padding:14px;border-bottom:1px solid #343a45}
tbody td{padding:14px;vertical-align:top;border-bottom:1px solid #292e37;font-size:13px;line-height:1.45}
tbody tr:last-child td{border-bottom:0}.med{font-weight:800;font-size:14px}.dose{font-weight:800}.warn{margin-top:7px;color:#ffb4ac;font-weight:700;font-size:12px}
.calc-small{margin-top:10px;border:1px solid #3c4654;background:#222832;color:#f5f7fa;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:800;cursor:pointer}

/* Calculator */
.calc-shell{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:16px;align-items:start}
.calc-panel,.calc-result{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.calc-panel h3,.calc-result h3{margin:0 0 15px;font-size:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{min-width:0}.field.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:800;color:#dce0e7;margin:0 0 7px}
.input,select.input{width:100%;min-height:48px;background:#101319;border:1px solid #353b46;color:#fff;border-radius:13px;padding:11px 12px;font-size:16px}
.input:disabled{opacity:.58}
.field-help{color:#7f8794;font-size:11px;line-height:1.4;margin-top:6px}
.patient-row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px;padding:12px 13px;border:1px solid #304039;background:#142019;border-radius:14px}
.patient-row strong{font-size:13px}.patient-row span{display:block;color:#9fb1a5;font-size:11px;margin-top:2px}
.ghost-btn{border:1px solid #3b424e;background:#20252d;border-radius:11px;padding:9px 11px;font-size:12px;font-weight:800;cursor:pointer}
.calc-submit{width:100%;min-height:52px;border:0;border-radius:15px;margin-top:16px;background:#f3f4f6;color:#111318;font-weight:900;cursor:pointer}
.calc-submit:disabled{opacity:.4;cursor:not-allowed}
.range-box{padding:11px 12px;background:#12161c;border:1px solid #313844;border-radius:12px;color:#c8cdd6;font-size:12px;line-height:1.5}
.result-empty{min-height:280px;display:grid;place-items:center;text-align:center;color:#78808c;padding:28px}
.result-empty .big{font-size:38px;margin-bottom:9px}
.result-head{color:#aeb4c0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.result-dose{font-size:clamp(34px,7vw,55px);line-height:1.05;font-weight:950;letter-spacing:-1.5px;margin:9px 0 7px}
.result-sub{color:#c8cdd5;font-size:14px;line-height:1.5}
.formula{margin-top:18px;background:#101319;border:1px solid #313743;border-radius:16px;padding:15px}
.formula-title{font-size:12px;color:#8f97a3;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px}
.formula-line{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.65;overflow-wrap:anywhere}
.calc-alert{margin-top:14px;border-left:4px solid var(--warning);background:#241d13;border-radius:12px;padding:12px 13px;color:#f2d6ad;font-size:12px;line-height:1.5}
.calc-source{margin-top:13px;color:#737b87;font-size:11px;line-height:1.45}
.calc-actions{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 16px}
.calc-nav-btn{border:1px solid var(--line);background:#171a21;border-radius:13px;padding:10px 12px;font-size:12px;font-weight:800;cursor:pointer}

@media(max-width:760px){
  .app{padding:10px 10px 44px}.splash{min-height:640px;padding:48px 15px 64px}.splash-logo{width:90px;height:90px;border-radius:26px;font-size:45px}.splash-title{letter-spacing:-2px}
  .hero{padding:18px 8px 12px}h1{font-size:30px}.logo{width:52px;height:52px;border-radius:16px}
  .dashboard-actions{grid-template-columns:1fr}.grid{grid-template-columns:1fr;gap:11px}.card{min-height:132px;padding:18px}.tablewrap{border-radius:16px}
  .calc-shell{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}
  .calc-panel,.calc-result{padding:16px;border-radius:18px}
}

.protocol-table{min-width:1380px}.contra-cell{min-width:260px;color:#ffd7d3}.calc-alert.danger{border-left-color:#ef4444;background:#271416;color:#ffd1ce}

.stock-warning{border-color:#6b4b20;background:#211a10;color:#ffdca8}

/* ===== Vet Guide: responsive safety + species-specific doses ===== */
.stock-warning{border-color:#6b4b20;background:#211a10;color:#ffdca8}
.protocol-legend{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.protocol-legend span,.safety-badge{font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px;border:1px solid var(--line)}
.legend-dose{background:#142235;color:#bdd9ff}.legend-contra{background:#321717;color:#ffb5af}.legend-prec{background:#302614;color:#ffdfa6}
.wide-table{min-width:1900px}.dog-cell{background:rgba(46,107,178,.06)}.cat-cell{background:rgba(34,150,167,.06)}.contra-cell{color:#ffc1bc;font-weight:700}
.mobile-med-list{display:none}
.med-card{border:1px solid var(--line);background:var(--card);border-radius:19px;padding:15px;margin-bottom:12px}
.med-card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.med-card h3{margin:0;font-size:18px}.med-card-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.med-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.safety-badge{background:#2a1616;color:#ffbcb6;border-color:#61302d}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.detail{background:#11141a;border:1px solid #2b3039;border-radius:12px;padding:10px}
.detail span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#89919e;font-weight:800;margin-bottom:5px}.detail strong{font-size:12px;line-height:1.45}
.detail.dog{border-color:#29445e}.detail.cat{border-color:#24565c}.contra-box,.prec-box,.safety-panel,.contra-result{margin-top:10px;border-radius:12px;padding:11px 12px;font-size:12px;line-height:1.5}
.contra-box,.contra-result{background:#2b1515;border:1px solid #5c2a27;color:#ffd0cb}.prec-box{background:#241e13;border:1px solid #57451f;color:#f5dcad}
.box-label,.safety-title{font-weight:900;margin-bottom:4px}.safety-panel{background:#171a21;border:1px solid var(--line);color:#d7dbe2;margin-top:15px}.safety-title{color:#ffaaa4}.safety-title.amber{color:#ffd28a;margin-top:10px}.safety-panel p{margin:4px 0 0}
.contra-result{margin-top:14px}
@media(max-width:760px){
  .desktop-table{display:none}.mobile-med-list{display:block}
  .detail-grid{grid-template-columns:1fr}.med-card{padding:14px}.med-card-head{display:block}.med-badges{justify-content:flex-start;margin-top:8px}
}

/* v7 · ajuste de comprimidos */
.tablet-advice{margin-top:16px;border:1px solid #36506a;background:#111923;border-radius:16px;padding:14px}
.tablet-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:900;color:#a8c8e8;margin-bottom:7px}
.tablet-main{font-size:22px;font-weight:950;line-height:1.25;letter-spacing:-.3px}
.tablet-stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
.tablet-stats span{background:#0d1218;border:1px solid #29333d;border-radius:10px;padding:8px;font-size:11px;line-height:1.35}
.tablet-note{margin-top:9px;color:#aab4c0;font-size:11px;line-height:1.45}
.tablet-good{border-color:#315d45}.tablet-mid{border-color:#76602d}.tablet-far{border-color:#7b3734}
@media(max-width:520px){.tablet-stats{grid-template-columns:1fr}.tablet-main{font-size:20px}}


/* Access gate */
.access-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,#242a35 0,#0f1115 45%)}
.access-card{width:min(460px,100%);background:#171a21;border:1px solid #303642;border-radius:28px;padding:30px;box-shadow:0 28px 80px rgba(0,0,0,.36);text-align:center}
.access-mark{width:82px;height:82px;margin:0 auto 20px;border-radius:24px;background:linear-gradient(145deg,#d32f2f,#741f3a);display:grid;place-items:center;font-size:34px;font-weight:950;letter-spacing:-2px}
.access-card h1{font-size:38px;margin:0}.access-tagline{max-width:390px;margin:14px auto 18px;color:#f0f2f5;font-size:18px;line-height:1.5;font-weight:650}.access-kicker{margin:0 0 22px;color:#aeb4c0;font-size:13px;line-height:1.5}
.access-form{display:grid;gap:12px}.access-input{width:100%;min-height:52px;border-radius:15px;border:1px solid #363d49;background:#101319;color:#fff;padding:12px 14px;font-size:17px;text-align:center;letter-spacing:.04em}
.access-btn{min-height:52px;border:0;border-radius:15px;background:#f3f4f6;color:#111318;font-weight:900;cursor:pointer}
.access-error{min-height:20px;color:#ff9f98;font-size:12px;margin-top:4px}.access-note{margin:18px 0 0;color:#737b87;font-size:11px;line-height:1.5}
.independent-note{margin-top:10px;color:#737b87;font-size:11px;line-height:1.45}

</style>
</head>

async function sha256(value) {
  if (!window.crypto?.subtle) throw new Error("Este navegador no permite validar el acceso. Ábrelo desde HTTPS.");
  const bytes = new TextEncoder().encode(value);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function accessIsValid() {
  if (!ACCESS.enabled) return true;
  const until = Number(localStorage.getItem("madridRioAccessUntil") || 0);
  return until > Date.now();
}
function grantAccess() {
  const until = Date.now() + ACCESS.rememberDays*24*60*60*1000;
  localStorage.setItem("madridRioAccessUntil", String(until));
}
function renderAccessGate() {
  document.title = "Vet Guide · Acceso";
  app.innerHTML = `

      </div>
    </section>`;
  const form = document.getElementById("accessForm");
  const input = document.getElementById("accessInput");
  const error = document.getElementById("accessError");
  input.focus();
  form.addEventListener("submit", async (ev)=>{
    ev.preventDefault();
    error.textContent = "Comprobando…";
    try {
      const hash = await sha256(input.value);
      if (hash === ACCESS.hash) {
        grantAccess();
        input.value = "";
        renderRoute();
      } else {
        error.textContent = "Clave incorrecta.";
        input.select();
      }
    } catch (e) {
      error.textContent = e.message || "No se pudo validar el acceso.";
    }
  });
}

  if (accessIsValid()) renderRoute();
  else renderAccessGate();

function esc(v="") {
  return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]||c));
}
function num(v) {
  if (typeof v==="string") v=v.replace(",",".");
  const n=Number(v); return Number.isFinite(n)?n:NaN;
}
function fmt(n,max=3) {
  if(!Number.isFinite(n)) return "—";
  return new Intl.NumberFormat("es-ES",{maximumFractionDigits:max}).format(n);
}

function fracText(q){
  const whole=Math.floor(q+1e-9), f=q-whole;
  let tail="";
  if(Math.abs(f-0.25)<0.001)tail="¼";
  else if(Math.abs(f-0.5)<0.001)tail="½";
  else if(Math.abs(f-0.75)<0.001)tail="¾";
  else if(Math.abs(f-1/3)<0.002)tail="⅓";
  else if(Math.abs(f-2/3)<0.002)tail="⅔";
  else if(f>0.001)tail=fmt(f,2);
  return (whole?String(whole):"")+tail || "0";
}
function planText(plan){
  return plan.filter(x=>x[1]>0).map(x=>`${fracText(x[1])} comp. de ${fmt(x[0])} mg`).join(" + ");
}
function officialTabletPlan(cfg,w,species){
  const table = species==="dog" ? (cfg.officialDog||cfg.official) : (cfg.officialCat||cfg.official);
  if(!table)return null;
  const hit=table.find(r=>w>=r.min && w<=r.max);
  if(!hit)return null;
  const actual=hit.plan.reduce((s,x)=>s+x[0]*x[1],0);
  return {plan:hit.plan,actual,official:true};
}
function bestTabletPlan(id,targetMg,w,species){
  const cfg=TABLET_OPTIONS[id];
  if(!cfg || !Number.isFinite(targetMg) || targetMg<=0)return null;
  const off=officialTabletPlan(cfg,w,species);
  if(off){
    off.target=targetMg;
    off.errorPct=(off.actual-targetMg)/targetMg*100;
    off.actualMgKg=off.actual/w;
    off.note=cfg.note||"";
    return off;
  }
  const opts=cfg[species];
  if(!opts?.length)return null;

  // Búsqueda matemática entre las concentraciones del stock y SOLO las fracciones
  // que el prospecto permite para cada presentación.
  let best=null;
  function walk(i,plan,total,tabletCount,types){
    if(i===opts.length){
      if(total<=0)return;
      const rel=Math.abs(total-targetMg)/targetMg;
      const score=rel*100 + tabletCount*0.012 + types*0.006;
      if(!best || score<best.score-1e-10){
        best={score,plan:plan.slice(),actual:total,target:targetMg};
      }
      return;
    }
    const o=opts[i], maxTabs=Math.max(3,Math.ceil(targetMg/o.mg)+1), maxUnits=Math.min(maxTabs*o.divisor,20);
    for(let units=0;units<=maxUnits;units++){
      const q=units/o.divisor;
      plan.push([o.mg,q]);
      walk(i+1,plan,total+o.mg*q,tabletCount+q,types+(q>0?1:0));
      plan.pop();
    }
  }
  walk(0,[],0,0,0);
  if(!best)return null;
  best.plan=best.plan.filter(x=>x[1]>0);
  best.errorPct=(best.actual-targetMg)/targetMg*100;
  best.actualMgKg=best.actual/w;
  best.official=false;
  best.note=cfg.note||"";
  return best;
}
function tabletAdviceHtml(plan,medId){
  if(!plan)return "";
  const diff=Math.abs(plan.errorPct);
  const cls=diff<=5?"tablet-good":diff<=15?"tablet-mid":"tablet-far";
  const source=plan.official?"Según tabla oficial del prospecto":"Mejor ajuste matemático con el stock cargado";
  return `<div class="tablet-advice ${cls}">
    <div class="tablet-kicker">💊 ${source}</div>
    <div class="tablet-main">${esc(planText(plan.plan))}</div>
    <div class="tablet-stats">
      <span><strong>Objetivo:</strong> ${fmt(plan.target)} mg</span>
      <span><strong>Administrado:</strong> ${fmt(plan.actual)} mg</span>
      <span><strong>Dosis real:</strong> ${fmt(plan.actualMgKg)} mg/kg</span>
      <span><strong>Diferencia:</strong> ${plan.errorPct>=0?"+":""}${fmt(plan.errorPct,1)}%</span>
    </div>
    ${plan.note?`<div class="tablet-note">${esc(plan.note)}</div>`:""}
    ${!plan.official?`<div class="tablet-note"><strong>Comprobar</strong> que la dosis real queda dentro del rango/tabla de la ficha antes de prescribir.</div>`:""}
  </div>`;
}
function mgWithMicro(mg){
  if(mg>0 && mg<1)return `${fmt(mg,4)} mg (${fmt(mg*1000,1)} µg)`;
  return `${fmt(mg)} mg`;
}

function calculator(selectedId="") {
  document.title="Vet Guide · Calculadora";
  const selected=CALCULATORS.find(c=>c.id===selectedId)||CALCULATORS[0];
  app.innerHTML=`
    <div class="topbar"><button class="back" id="backCalc" type="button">‹ Protocolos</button>
      <div class="titlewrap"><h2 class="ptitle">🧮 Calculadora de dosis</h2><p class="psub">Resultado + fórmula + seguridad del prospecto.</p></div>
    </div>
    <section class="calc-shell">
      <div class="calc-panel">
        <h3>Datos</h3>
        <div class="form-grid">
          <div class="field full"><label>Medicamento</label><select id="medSelect" class="input">${groupedOptions(selected.id)}</select></div>
          <div class="field"><label>Especie</label><select id="speciesSelect" class="input"></select></div>
          <div class="field"><label>Peso (kg)</label><input id="weightInput" class="input" type="number" inputmode="decimal" min="0.1" max="200" step="0.01" placeholder="Ej. 12,4"></div>
          <div class="field"><label>Edad (opcional)</label><input id="ageInput" class="input" type="number" inputmode="decimal" min="0" max="300" step="0.1" placeholder="Ej. 11"></div>
          <div class="field"><label>Unidad de edad</label><select id="ageUnit" class="input"><option value="months">meses</option><option value="weeks">semanas</option></select></div>
          <div id="growthField" class="field full"></div>
          <div class="field full"><label>Indicación / pauta</label><select id="indicationSelect" class="input"></select></div>
          <div id="doseField" class="field full"></div><div id="splitField" class="field full"></div><div id="extraField" class="field full"></div>
          <div id="rangeInfo" class="field full"></div>
        </div>
        <div id="safetyBox"></div>
        <button id="calculateBtn" class="calc-submit" type="button">CALCULAR DOSIS</button>
      </div>
      <aside id="calcResult" class="calc-result"><div class="result-empty"><div><div class="big">🧮</div><strong>Introduce los datos</strong><p>Verás la dosis y cómo se ha calculado.</p></div></div></aside>
    </section>
    <div class="notice"><strong>Importante:</strong> edad y tamaño se usan solo para alertas de seguridad configuradas. No sustituyen la lectura de la ficha ni la valoración clínica.</div>`;

  const medSelect=document.getElementById("medSelect"), speciesSelect=document.getElementById("speciesSelect"),
        weightInput=document.getElementById("weightInput"), ageInput=document.getElementById("ageInput"), ageUnit=document.getElementById("ageUnit"),
        indicationSelect=document.getElementById("indicationSelect"), doseField=document.getElementById("doseField"),
        splitField=document.getElementById("splitField"), extraField=document.getElementById("extraField"), rangeInfo=document.getElementById("rangeInfo"),
        safetyBox=document.getElementById("safetyBox"), growthField=document.getElementById("growthField"), result=document.getElementById("calcResult");

  function currentMed(){return CALCULATORS.find(c=>c.id===medSelect.value);}
  function currentRow(){return findRowByCalc(medSelect.value);}
  function eligibleIndications(){const med=currentMed();return med.indications.map((i,idx)=>({i,idx})).filter(x=>!x.i.species||x.i.species.includes(speciesSelect.value));}
  function currentInd(){const med=currentMed();return med.indications[Number(indicationSelect.value)||0];}
  function resetResult(){result.innerHTML=`<div class="result-empty"><div><div class="big">🧮</div><strong>Listo para calcular</strong><p>Comprueba los datos y la seguridad.</p></div></div>`;}
  function fillSpecies(){const med=currentMed();speciesSelect.innerHTML=med.species.map(s=>`<option value="${s}">${speciesLabel(s)}</option>`).join("");speciesSelect.value=med.species[0];}
  function fillIndications(){const e=eligibleIndications();indicationSelect.innerHTML=e.map(x=>`<option value="${x.idx}">${esc(x.i.label)}</option>`).join("");if(!e.length)indicationSelect.innerHTML='<option value="0">Sin pauta para esta especie</option>';}
  function showGrowthField(){const rule=SAFETY_RULES[medSelect.value];growthField.innerHTML=(rule&&rule.largeMinAgeMonths)?`<label>Tamaño durante crecimiento</label><select id="growthSelect" class="input"><option value="standard">pequeña/estándar</option><option value="large">raza grande</option></select>`:"";}
  function renderSafety(){
    const r=currentRow();
    if(!r){safetyBox.innerHTML="";return;}
    safetyBox.innerHTML=`<div class="safety-panel"><div class="safety-title">⛔ Contraindicaciones principales</div><p>${esc(r.contraFormal)}</p><div class="safety-title amber">⚠ Precauciones / interacciones</div><p>${esc(r.precautions||r.alert||"Consultar ficha vigente.")}</p></div>`;
  }
  function fillDoseControls(){
    const ind=currentInd();doseField.innerHTML="";splitField.innerHTML="";extraField.innerHTML="";rangeInfo.innerHTML="";if(!ind)return;
    if(ind.mode==="prior_volume") extraField.innerHTML=`<label>Volumen previo de α2 (ml)</label><input id="priorVolumeInput" class="input" type="number" inputmode="decimal" min="0.001" max="20" step="0.01">`;
    if(ind.dose?.kind==="range"){doseField.innerHTML=`<label>Dosis seleccionada (${esc(ind.basis)})</label><input id="doseInput" class="input" type="number" inputmode="decimal" min="${ind.dose.min}" max="${ind.dose.max}" step="${ind.dose.step||0.01}" placeholder="${fmt(ind.dose.min)}–${fmt(ind.dose.max)}" value="${Number.isFinite(ind.dose.default)?ind.dose.default:""}">`;rangeInfo.innerHTML=`<div class="range-box"><strong>Rango:</strong> ${fmt(ind.dose.min)}–${fmt(ind.dose.max)} ${esc(ind.basis)} · ${esc(ind.frequency)}${medSelect.value==="caliercortin"?`<br><strong>Equivalencia:</strong> 0,025–0,063 ml/kg. <strong>0,06 ml/kg = 0,24 mg/kg.</strong>`:""}</div>`;}
    else if(ind.dose?.kind==="fixed") rangeInfo.innerHTML=`<div class="range-box"><strong>Dosis:</strong> ${fmt(ind.dose.value)} ${esc(ind.basis)} · ${esc(ind.frequency)}</div>`;
    else if(ind.mode==="combo") rangeInfo.innerHTML=`<div class="range-box"><strong>Dosis:</strong> ${ind.components.map(c=>`${esc(c.name)} ${fmt(c.dose)} mg/kg`).join(" + ")} · ${esc(ind.frequency)}</div>`;
    else if(ind.mode==="mlkg") rangeInfo.innerHTML=`<div class="range-box"><strong>Dosis:</strong> ${fmt(ind.mlkg)} ml/kg · ${esc(ind.frequency)}</div>`;
    else if(ind.mode==="ml_per_weight") rangeInfo.innerHTML=`<div class="range-box"><strong>Dosis:</strong> ${fmt(ind.ml)} ml / ${fmt(ind.perKg)} kg · ${esc(ind.frequency)}</div>`;
    else if(ind.mode==="cytopoint_table") rangeInfo.innerHTML=`<div class="range-box"><strong>Tabla oficial:</strong> mínimo 1 mg/kg mensual; viales completos por rango.</div>`;
    else if(ind.mode==="librela_table") rangeInfo.innerHTML=`<div class="range-box"><strong>Tabla oficial:</strong> 0,5–1 mg/kg mensual; viales por rango.</div>`;
    else if(ind.mode==="prior_volume") rangeInfo.innerHTML=`<div class="range-box"><strong>Regla:</strong> perro = mismo volumen; gato = 1/2 del volumen previo.</div>`;
    if(ind.mode==="mgkg_daily_split") splitField.innerHTML=`<label>Dividir dosis diaria en</label><select id="splitSelect" class="input">${ind.split_options.map(n=>`<option value="${n}">${n} administración${n>1?"es":""}/día</option>`).join("")}</select>`;
  }
  function updateMedView(){fillSpecies();fillIndications();showGrowthField();fillDoseControls();renderSafety();resetResult();history.replaceState(null,"",`#calc:${currentMed().id}`);}
  function doseSelected(ind){if(ind.dose?.kind==="fixed")return ind.dose.value;if(ind.dose?.kind==="range"){const d=num(document.getElementById("doseInput")?.value);if(!Number.isFinite(d)||d<ind.dose.min||d>ind.dose.max)throw new Error(`Introduce una dosis dentro de ${fmt(ind.dose.min)}–${fmt(ind.dose.max)} ${ind.basis}.`);return d;}return NaN;}
  function enteredAgeIn(unit){const a=num(ageInput.value);if(!Number.isFinite(a))return NaN;if(ageUnit.value===unit)return a;if(unit==="weeks"&&ageUnit.value==="months")return a*4.345;if(unit==="months"&&ageUnit.value==="weeks")return a/4.345;return NaN;}
  function validateSafety(w){
    const rule=SAFETY_RULES[medSelect.value]; if(!rule)return [];
    const warns=[]; let blocked=false;
    if(Number.isFinite(rule.minWeight)&&w<rule.minWeight){warns.push(rule.message);blocked=blocked||rule.hard;}
    if(speciesSelect.value==="cat"&&Number.isFinite(rule.catMinWeight)&&w<rule.catMinWeight){warns.push(rule.message);blocked=blocked||rule.hard;}
    const aw=enteredAgeIn("weeks"), am=enteredAgeIn("months");
    if(Number.isFinite(rule.minAgeWeeks)&&Number.isFinite(aw)&&aw<rule.minAgeWeeks){warns.push(rule.message);blocked=blocked||rule.hard;}
    if(speciesSelect.value==="dog"&&Number.isFinite(rule.dogMinAgeWeeks)&&Number.isFinite(aw)&&aw<rule.dogMinAgeWeeks){warns.push(rule.message);blocked=blocked||rule.hard;}
    if(speciesSelect.value==="cat"&&Number.isFinite(rule.catMinAgeWeeks)&&Number.isFinite(aw)&&aw<rule.catMinAgeWeeks){warns.push(rule.message);blocked=blocked||rule.hard;}
    if(Number.isFinite(rule.minAgeMonths)&&Number.isFinite(am)){
      let min=rule.minAgeMonths;
      const growth=document.getElementById("growthSelect")?.value;
      if(growth==="large"&&Number.isFinite(rule.largeMinAgeMonths))min=rule.largeMinAgeMonths;
      if(am<min){warns.push(rule.message);blocked=blocked||rule.hard;}
    }
    if(blocked) throw new Error([...new Set(warns)].join(" "));
    return [...new Set(warns)];
  }
  function errorCard(msg){result.innerHTML=`<div class="result-empty"><div><div class="big">⛔</div><strong>No calcular</strong><p>${esc(msg)}</p></div></div>`;}
  function calculate(){
    try {
      const med=currentMed(),ind=currentInd();if(!ind)throw new Error("No hay pauta configurada para esta especie.");
      const w=num(weightInput.value);if(ind.mode!=="prior_volume"&&(!Number.isFinite(w)||w<0.1||w>200))throw new Error("Introduce un peso válido.");
      const softWarnings=Number.isFinite(w)?validateSafety(w):[];
      let headline="",sub="",lines=[],extra="",tabletTarget=null,tabletPlan=null;

      if(ind.mode==="mgkg_ml"){
        const d=doseSelected(ind),mg=w*d,ml=mg/ind.concentration;
        headline=`${mgWithMicro(mg)} → ${fmt(ml)} ml`;
        sub=`${med.active} · concentración ${fmt(ind.concentration)} mg/ml · ${ind.frequency}`;
        lines=[`${fmt(w)} kg × ${fmt(d)} mg/kg = ${fmt(mg)} mg`,`${fmt(mg)} mg ÷ ${fmt(ind.concentration)} mg/ml = ${fmt(ml)} ml`];
      }
      else if(ind.mode==="mgkg"){
        const d=doseSelected(ind),mg=w*d;
        headline=`${fmt(mg)} mg`;
        sub=`${med.active} · ${ind.frequency}`;
        lines=[`${fmt(w)} kg × ${fmt(d)} mg/kg = ${fmt(mg)} mg`];
        tabletTarget=mg;
      }
      else if(ind.mode==="mgkg_divided"){
        const d=doseSelected(ind),total=w*d,per=total/ind.divisor;
        headline=`${fmt(per)} mg / toma`;
        sub=`${fmt(total)} mg/día de ${med.active}`;
        lines=[`${fmt(w)} kg × ${fmt(d)} mg/kg/día = ${fmt(total)} mg/día`,`${fmt(total)} ÷ ${ind.divisor} = ${fmt(per)} mg/toma`];
        tabletTarget=per;
      }
      else if(ind.mode==="mgkg_daily_split"){
        const d=doseSelected(ind),total=w*d,split=Number(document.getElementById("splitSelect")?.value||1),per=total/split;
        headline=split===1?`${fmt(total)} mg / día`:`${fmt(per)} mg / toma`;
        sub=`${fmt(total)} mg/día de ${med.active}`;
        lines=[`${fmt(w)} kg × ${fmt(d)} mg/kg/día = ${fmt(total)} mg/día`,...(split>1?[`${fmt(total)} ÷ ${split} = ${fmt(per)} mg/toma`]:[])];
        tabletTarget=per;
      }
      else if(ind.mode==="combo"){
        const vals=ind.components.map(c=>({name:c.name,dose:c.dose,mg:w*c.dose})),total=vals.reduce((a,b)=>a+b.mg,0);
        headline=`${fmt(total)} mg totales`;
        sub=vals.map(v=>`${v.name}: ${fmt(v.mg)} mg`).join(" · ");
        lines=vals.map(v=>`${fmt(w)} kg × ${fmt(v.dose)} mg/kg = ${fmt(v.mg)} mg de ${v.name}`);
        tabletTarget=total;
      }
      else if(ind.mode==="linked_combo_divided"){
        const d=doseSelected(ind),pd=w*d,pper=pd/ind.divisor,linked=ind.linked.map(c=>{const ld=d*c.multiplier,day=w*ld;return{name:c.name,dose:ld,daily:day,per:day/ind.divisor};});
        headline=`${fmt(pper)} mg ${ind.primary}/toma`;
        sub=`${fmt(pd)} mg/día ${ind.primary}`;
        lines=[`${fmt(w)}×${fmt(d)}=${fmt(pd)} mg/día`,`${fmt(pd)}÷${ind.divisor}=${fmt(pper)} mg/toma`,...linked.flatMap(v=>[`${fmt(w)}×${fmt(v.dose)}=${fmt(v.daily)} mg/día ${v.name}`,`${fmt(v.daily)}÷${ind.divisor}=${fmt(v.per)} mg/toma`])];
      }
      else if(ind.mode==="mlkg"){
        const ml=w*ind.mlkg;headline=`${fmt(ml)} ml`;sub=`${med.active} · ${ind.frequency}`;lines=[`${fmt(w)} kg × ${fmt(ind.mlkg)} ml/kg = ${fmt(ml)} ml`];
      }
      else if(ind.mode==="ml_per_weight"){
        const ml=(w/ind.perKg)*ind.ml;headline=`${fmt(ml)} ml`;sub=`${med.active} · ${ind.frequency}`;lines=[`${fmt(w)} ÷ ${fmt(ind.perKg)} × ${fmt(ind.ml)} = ${fmt(ml)} ml`];
      }
      else if(ind.mode==="prior_volume"){
        const prior=num(document.getElementById("priorVolumeInput")?.value);if(!Number.isFinite(prior)||prior<=0)throw new Error("Introduce el volumen previo.");
        const f=speciesSelect.value==="dog"?1:.5,ml=prior*f,mg=ml*5;
        headline=`${mgWithMicro(mg)} → ${fmt(ml)} ml`;
        sub=`Revazol 5 mg/ml`;
        lines=[`${fmt(prior)} ml × ${f} = ${fmt(ml)} ml`,`${fmt(ml)} ml × 5 mg/ml = ${fmt(mg)} mg`];
      }
      else if(ind.mode==="cytopoint_table"){
        if(w<3||w>80)throw new Error("Tabla configurada para 3–80 kg.");let v=[];
        if(w<=10)v=[[10,1]];else if(w<=20)v=[[20,1]];else if(w<=30)v=[[30,1]];else if(w<=40)v=[[40,1]];else if(w<=50)v=[[10,1],[40,1]];else if(w<=60)v=[[30,2]];else if(w<=70)v=[[30,1],[40,1]];else v=[[40,2]];
        const total=v.reduce((a,x)=>a+x[0]*x[1],0),ml=v.reduce((a,x)=>a+x[1],0);
        headline=`${fmt(total)} mg → ${fmt(ml)} ml`;
        sub=v.map(x=>`${x[1]}× vial ${x[0]} mg/1 ml`).join(" + ");
        lines=[`Peso ${fmt(w)} kg → tabla oficial`,`${sub}`,`Total: ${total} mg en ${ml} ml`];
      }
      else if(ind.mode==="librela_table"){
        if(w<5||w>120)throw new Error("Tabla configurada para 5–120 kg.");let v=[];
        if(w<=10)v=[[5,1]];else if(w<=20)v=[[10,1]];else if(w<=30)v=[[15,1]];else if(w<=40)v=[[20,1]];else if(w<=60)v=[[30,1]];else if(w<=80)v=[[20,2]];else if(w<=100)v=[[20,1],[30,1]];else v=[[30,2]];
        const total=v.reduce((a,x)=>a+x[0]*x[1],0),ml=v.reduce((a,x)=>a+x[1],0);
        headline=`${fmt(total)} mg → ${fmt(ml)} ml`;
        sub=v.map(x=>`${x[1]}× vial ${x[0]} mg/1 ml`).join(" + ");
        lines=[`Peso ${fmt(w)} kg → tabla oficial`,`${sub}`,`Total: ${total} mg en ${ml} ml`];
      }
      else throw new Error("Cálculo no configurado.");

      if(Number.isFinite(tabletTarget)) tabletPlan=bestTabletPlan(medSelect.value,tabletTarget,w,speciesSelect.value);

      const r=currentRow();
      result.innerHTML=`<div class="result-head">${esc(med.name)} · ${esc(speciesLabel(speciesSelect.value))} · ${Number.isFinite(w)?fmt(w)+" kg":""}</div>
        <div class="result-dose">${headline}</div><div class="result-sub">${esc(sub)}</div>
        ${tabletAdviceHtml(tabletPlan,medSelect.value)}
        <div class="formula"><div class="formula-title">Cómo se ha calculado</div>${lines.map(l=>`<div class="formula-line">${esc(l)}</div>`).join("")}</div>
        ${softWarnings.length?`<div class="calc-alert">${softWarnings.map(w=>`⚠ ${esc(w)}`).join("<br>")}</div>`:""}
        ${extra?`<div class="calc-alert">${esc(extra)}</div>`:""}
        ${r?`<div class="contra-result"><strong>⛔ Contraindicaciones:</strong> ${esc(r.contraFormal)}</div>`:""}
        <div class="calc-source">Comprimidos: solo se fraccionan según divisibilidad cargada del prospecto. Confirma siempre ficha técnica vigente, presentación exacta y que la dosis real quede dentro del rango autorizado.</div>`;
    } catch(e) { errorCard(e.message||"Revisa los datos."); }
  }
  
  medSelect.onchange=updateMedView;
  speciesSelect.onchange=()=>{fillIndications();fillDoseControls();renderSafety();resetResult();};
  indicationSelect.onchange=()=>{fillDoseControls();resetResult();};
  document.getElementById("calculateBtn").onclick=calculate;
  document.getElementById("backCalc").onclick=()=>route("#protocolos");
  fillSpecies();fillIndications();showGrowthField();fillDoseControls();renderSafety();resetResult();
  window.scrollTo(0,0);
}

function renderRoute() {
  const h=location.hash.replace("#","");
  if(!h)return splash();
  if(h==="protocolos")return home();
  if(h==="calculadora")return calculator("");
  if(h.startsWith("protocolo:"))return showProtocol(h.split(":")[1]);
  if(h.startsWith("calc:"))return calculator(h.split(":")[1]);
  return home();
}

bootApp();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
